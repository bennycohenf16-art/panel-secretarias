<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 44" fill="none">

  <!-- ── ISOTIPO: Calendario-Cerebro con IA ── -->

  <!-- Cuerpo del calendario (outline cian) -->
  <rect x="2" y="8" width="36" height="34" rx="7" stroke="#06B6D4" stroke-width="2.2"/>

  <!-- Barra de encabezado del calendario (relleno cian sólido) -->
  <rect x="2" y="8" width="36" height="12" rx="7" fill="#06B6D4"/>
  <rect x="2" y="15" width="36" height="5" fill="#06B6D4"/>

  <!-- Argollas del calendario (parte superior) -->
  <rect x="10.5" y="3" width="3" height="10" rx="1.5" fill="#2DD4BF"/>
  <rect x="26.5" y="3" width="3" height="10" rx="1.5" fill="#2DD4BF"/>

  <!-- Red neuronal interior (3 nodos + conexiones = concepto IA/cerebro) -->
  <!-- Líneas de conexión (primero, para quedar detrás de los nodos) -->
  <line x1="12" y1="29" x2="20" y2="24.5" stroke="#2DD4BF" stroke-width="1.3" opacity="0.55"/>
  <line x1="20" y1="24.5" x2="28" y2="29" stroke="#2DD4BF" stroke-width="1.3" opacity="0.55"/>
  <line x1="12" y1="29" x2="28" y2="29" stroke="#2DD4BF" stroke-width="1.1" opacity="0.35"/>

  <!-- Nodos neurales -->
  <circle cx="12" cy="29" r="2.8" fill="#2DD4BF" opacity="0.85"/>
  <circle cx="20" cy="24.5" r="3.1" fill="#06B6D4"/>
  <circle cx="28" cy="29" r="2.8" fill="#2DD4BF" opacity="0.85"/>

  <!-- Badge "IA" en la esquina inferior derecha del calendario -->
  <rect x="22.5" y="33" width="14" height="8.5" rx="2.5" fill="#06B6D4"/>
  <text x="26" y="40.5"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-size="7.5" font-weight="800" fill="#FFFFFF">IA</text>

  <!-- ── TEXTO: AGENDIA (blanco, sin eslogan) ── -->
  <text x="48" y="32"
        font-family="'Inter','Montserrat','Helvetica Neue',Arial,sans-serif"
        font-size="25" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">AGENDIA</text>
</svg>
