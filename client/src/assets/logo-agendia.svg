<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 85" width="100%" height="100%">
  <defs>
    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>
  </defs>

  <!-- ── ISOTIPO: Calendario-Cerebro con IA ── -->
  <g transform="translate(8, 8)">
    <!-- Cuerpo del calendario -->
    <rect x="0" y="8" width="54" height="60" rx="11" fill="url(#calGrad)"/>

    <!-- Barra superior del calendario (tono más oscuro) -->
    <rect x="0" y="8" width="54" height="17" rx="11" fill="#0891B2"/>
    <rect x="0" y="20" width="54" height="5" fill="#0891B2"/>

    <!-- Argollas -->
    <rect x="13" y="1" width="5" height="14" rx="2.5" fill="#0D9488"/>
    <rect x="36" y="1" width="5" height="14" rx="2.5" fill="#0D9488"/>

    <!-- Red neuronal interior (nodos blancos + conexiones) -->
    <line x1="14" y1="46" x2="27" y2="39" stroke="rgba(255,255,255,0.55)" stroke-width="1.8"/>
    <line x1="27" y1="39" x2="40" y2="46" stroke="rgba(255,255,255,0.55)" stroke-width="1.8"/>
    <line x1="14" y1="46" x2="40" y2="46" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

    <circle cx="14" cy="46" r="4.5" fill="rgba(255,255,255,0.85)"/>
    <circle cx="27" cy="39" r="5"   fill="#FFFFFF"/>
    <circle cx="40" cy="46" r="4.5" fill="rgba(255,255,255,0.85)"/>

    <!-- Badge "IA" en la esquina inferior derecha -->
    <rect x="33" y="53" width="20" height="13" rx="4" fill="#FFFFFF"/>
    <text x="36.5" y="64"
          font-family="'Inter','Helvetica Neue',sans-serif"
          font-size="10" font-weight="800" fill="#0891B2">IA</text>
  </g>

  <!-- ── TEXTO: AGENDIA ── -->
  <text x="76" y="52"
        font-family="'Inter','Montserrat','Helvetica Neue',Arial,sans-serif"
        font-size="38" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#0F172A">AGEND</tspan><tspan fill="#0891B2">IA</tspan>
  </text>

  <!-- ── ESLOGAN ── -->
  <text x="78" y="70"
        font-family="'Inter','Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.4">
    LA RECEPCIONISTA QUE NUNCA DUERME
  </text>
</svg>
