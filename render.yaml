services:
  - type: web
    name: agendia-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA routing: cualquier ruta desconocida sirve index.html para React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://panel-secretarias.onrender.com
